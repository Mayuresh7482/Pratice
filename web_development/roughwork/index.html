/*  Loader Spin Animation  */
        #loader {
            height: 200px;
            width: 200px;
            border: 20px solid #ffe66d;
            border-top: 20px solid cyan;
            border-radius: 50%;
            animation: spinAnimie 2s ease-in-out 0s infinite normal;
        }

        @keyframes spinAnimie {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
