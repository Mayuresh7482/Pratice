<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            background-color: #f1f1f1;
        }

        .container {
            width: 400px;
            margin: 100px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        #inputtext {
            width: 100%;
            height: 50px;
            font-size: 24px;
            text-align: right;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        button {
            width: 100%;
            height: 50px;
            font-size: 20px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #555;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Calculator</h1>
        <input type="text" name="calc" id="inputtext" placeholder="0" readonly>
        <div class="keypad">
            <button onclick="
            currentInput= '';
            document.querySelector('#inputtext').value = currentInput;">C</button>
            <button onclick="
            currentInput=currentInput+ '1';
            document.querySelector('#inputtext').value = currentInput;">1</button>
            <button onclick="
            currentInput=currentInput+ '2';
            document.querySelector('#inputtext').value = currentInput;">2</button>
            <button onclick="
            currentInput=currentInput+ '+';
            document.querySelector('#inputtext').value = currentInput;">+</button>
            <button onclick="
            currentInput=currentInput+ '3';
            document.querySelector('#inputtext').value = currentInput;">3</button>
            <button onclick="
            currentInput=currentInput+ '4';
            document.querySelector('#inputtext').value = currentInput;">4</button>
            <button onclick="
            currentInput=currentInput+ '-';
            document.querySelector('#inputtext').value = currentInput;">-</button>
            <button onclick="
            currentInput=currentInput+ '5';
            document.querySelector('#inputtext').value = currentInput;">5</button>
            <button onclick="
            currentInput=currentInput+ '6';
            document.querySelector('#inputtext').value = currentInput;">6</button>
            <button onclick="
            currentInput=currentInput+ '*';
            document.querySelector('#inputtext').value = currentInput;">*</button>
            <button onclick="
            currentInput=currentInput+ '7';
            document.querySelector('#inputtext').value = currentInput;">7</button>
            <button onclick="
            currentInput=currentInput+ '8';
            document.querySelector('#inputtext').value = currentInput;">8</button>
            <button onclick="
            currentInput=currentInput+ '/';
            document.querySelector('#inputtext').value = currentInput;">/</button>
            <button onclick="
            currentInput=currentInput+ '9';
            document.querySelector('#inputtext').value = currentInput;">9</button>
            <button onclick="
            currentInput= eval(currentInput);
            document.querySelector('#inputtext').value = currentInput;">=</button>
            <button onclick="
            currentInput=currentInput+ '0';
            document.querySelector('#inputtext').value = currentInput;">0</button>
            <button onclick="
            currentInput=currentInput+ '.';
            document.querySelector('#inputtext').value = currentInput;">.</button>
        </div>
    </div>
    <script>
        let currentInput = '';
        document.querySelector(".keypad").value = currentInput;
    </script>
</body>

</html>
